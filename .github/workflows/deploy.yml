name: Deploy to GCP

# 設定觸發條件：當 main 分支有新的 push 時觸發
on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          # 以下是登入 GCP 後要執行的腳本
          script: |
            # 1. 進入你的專案資料夾
            cd /home/ettt1224/morning752
            
            # 2. 解決 Git dubious ownership 權限問題
            git config --global --add safe.directory /home/ettt1224/morning752
            
            # 3. 從 GitHub 拉取最新程式碼
            git pull origin main
            
            # 4. 使用 sudo 和新版 docker compose 指令重新佈署
            sudo docker compose up -d --build
            
            # 5. 清理舊的 Docker image
            sudo docker image prune -f